services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: myrcrm
      POSTGRES_PASSWORD: myrcrm
      POSTGRES_DB: myrcrm
    ports:
      - "5432:5432"
    volumes:
      - myrcrm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myrcrm -d myrcrm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  myrcrm-postgres:
